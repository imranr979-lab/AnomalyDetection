version: "3.9"

services:

  api:
    build: .
    image: port-anomaly-detection:${TAG:-latest}
    container_name: port_anomaly_api
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    image: postgres:16-alpine
    container_name: port_anomaly_postgres
    environment:
      POSTGRES_DB:       port_anomaly
      POSTGRES_USER:     port_anomaly_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U port_anomaly_app -d port_anomaly"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
        -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
        -c log_connections=on
        -c log_disconnections=on
        -c log_duration=on
        -c log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    container_name: port_anomaly_redis
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --tls-port 6379
        --port 0
        --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
    internal: true   # No direct internet access from DB/cache containers
